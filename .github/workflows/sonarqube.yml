name: SonarQube

on:
  push:
    branches:
      - canary
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      # The scan is advisory rather than blocking: SONAR_TOKEN is currently rejected with
      # HTTP 403, so every run since March has failed and red-flagged unrelated pull requests.
      # The token needs rotating, and the SonarCloud project needs re-linking once the
      # repository moves to the zanreal-labs organisation (sonar.organization is still
      # z4nr34l). Once the scan is green again, drop continue-on-error so it blocks properly.
      - name: SonarQube Scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report scan status
        if: steps.sonar.outcome != 'success'
        run: |
          {
            echo "### SonarQube scan did not complete"
            echo
            echo "The scan is non-blocking while the SonarCloud project is being re-linked."
            echo "Rotate \`SONAR_TOKEN\` and point \`sonar-project.properties\` at the new"
            echo "organisation, then remove \`continue-on-error\` from this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
