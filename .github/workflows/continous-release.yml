name: Publish Any Commit
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Prepare
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build --filter @zanreal/nemo

      # Pinned rather than resolved at run time: this step runs on pull request code and publishes
      # a preview package, so the publisher itself should not float. Renovate has no manager for
      # `bunx` invocations, so bump this by hand.
      - run: bunx pkg-pr-new@0.0.80 publish "./packages/nemo"
